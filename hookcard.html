<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniTrend Hook Card Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    .glass-box {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-[#070a12] text-slate-200 min-h-screen font-sans p-4 md:p-6">

<div id="app" class="max-w-6xl mx-auto">

  <!-- Header -->
  <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-400 to-rose-500 flex items-center justify-center text-black font-black text-lg">
        H
      </div>
      <div>
        <h1 class="text-lg md:text-xl font-bold text-white">OmniTrend Hook Card Generator</h1>
        <p class="text-xs text-slate-400">Tự động thiết kế ảnh bìa Hook Card tỷ lệ 16:9 chuẩn đăng Album Facebook</p>
      </div>
    </div>
    <span class="px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-semibold">
      100% Canvas Trực Tiếp
    </span>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <!-- CỘT ĐIỀU KHIỂN (5 Cột) -->
    <div class="lg:col-span-5 glass-box rounded-2xl p-5 space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Tiêu đề Hook (Gây tò mò / Chữ lớn):</label>
        <input type="text" v-model="hookTitle" @input="drawCanvas" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-amber-400">
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-1">Nội dung phụ / Lời giải thích:</label>
        <textarea v-model="hookSubtitle" @input="drawCanvas" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white outline-none focus:border-amber-400"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-300 block mb-1">Badge thể loại:</label>
          <input type="text" v-model="badgeText" @input="drawCanvas" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-300 block mb-1">Thương hiệu / Tác giả:</label>
          <input type="text" v-model="authorTag" @input="drawCanvas" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-amber-400">
        </div>
      </div>

      <!-- Tùy chọn phối màu -->
      <div>
        <label class="text-xs font-semibold text-slate-300 block mb-2">Bộ màu nền Gradient:</label>
        <div class="flex gap-2">
          <button v-for="(theme, idx) in themes" :key="idx" 
                  @click="selectedTheme = theme; drawCanvas()" 
                  :class="selectedTheme.name === theme.name ? 'ring-2 ring-amber-400 scale-105' : 'opacity-70 hover:opacity-100'" 
                  :style="{ background: theme.preview }" 
                  class="w-8 h-8 rounded-lg shadow transition transform"></button>
        </div>
      </div>

      <div class="pt-2">
        <button @click="downloadCard" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-400 to-rose-500 hover:opacity-95 text-black font-bold text-xs flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 transition">
          <i class="fas fa-download"></i> Tải Ảnh Hook Card (.PNG) Về Máy
        </button>
      </div>
    </div>

    <!-- CỘT CANVAS XEM TRƯỚC (7 Cột) -->
    <div class="lg:col-span-7 flex flex-col items-center">
      <div class="w-full glass-box rounded-2xl p-4 flex flex-col items-center justify-center">
        <canvas id="hookCanvas" width="1280" height="720" class="w-full h-auto rounded-xl shadow-2xl border border-slate-800 bg-black"></canvas>
        <p class="text-[11px] text-slate-400 mt-3 text-center">
          <i class="fas fa-info-circle text-amber-400"></i> Ảnh xuất chuẩn 16:9 (1280x720px) — Bố cục chuẩn album 1 ngang 3 vuông.
        </p>
      </div>
    </div>

  </div>

</div>

<script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        hookTitle: 'BÍ MẬT TẠO VIDEO TRIỆU VIEW VỚI AI',
        hookSubtitle: 'Quy trình 3 bước tự động hóa khâu bóc tách nội dung và sinh phụ đề chuẩn xác.',
        badgeText: '★ XU HƯỚNG MỚI',
        authorTag: '@MaxNgo.AI Studio',
        themes: [
          { name: 'Sunset', from: '#831843', to: '#090d16', accent: '#f43f5e', preview: 'linear-gradient(to right, #831843, #090d16)' },
          { name: 'Cyber', from: '#1e1b4b', to: '#064e3b', accent: '#10b981', preview: 'linear-gradient(to right, #1e1b4b, #064e3b)' },
          { name: 'DarkGold', from: '#451a03', to: '#090d16', accent: '#f59e0b', preview: 'linear-gradient(to right, #451a03, #090d16)' },
          { name: 'NeonPurple', from: '#4c1d95', to: '#090d16', accent: '#a855f7', preview: 'linear-gradient(to right, #4c1d95, #090d16)' }
        ],
        selectedTheme: null
      }
    },
    created() {
      this.selectedTheme = this.themes[0];
    },
    mounted() {
      // Đợi DOM hoàn tất mới render Canvas tránh lỗi màn hình đen
      this.$nextTick(() => {
        setTimeout(() => {
          this.drawCanvas();
        }, 100);
      });
    },
    methods: {
      drawCanvas() {
        const canvas = document.getElementById('hookCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        // Nền Gradient
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, this.selectedTheme.from);
        grad.addColorStop(1, this.selectedTheme.to);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Họa tiết lưới mờ
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
        for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

        // Khung viền phát sáng
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 3;
        ctx.strokeRect(30, 30, W - 60, H - 60);

        // Badge góc trên
        ctx.fillStyle = this.selectedTheme.accent;
        ctx.fillRect(80, 80, 220, 42);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText(this.badgeText.toUpperCase(), 95, 107);

        // Tiêu đề Hook lớn
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 54px sans-serif';
        this.wrapText(ctx, this.hookTitle, 80, 240, W - 160, 70);

        // Nội dung phụ
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '24px sans-serif';
        this.wrapText(ctx, this.hookSubtitle, 80, 460, W - 200, 38);

        // Tác giả & Watermark
        ctx.fillStyle = this.selectedTheme.accent;
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(this.authorTag, 80, H - 80);
      },

      wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          const metrics = ctx.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            ctx.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, x, y);
      },

      downloadCard() {
        const canvas = document.getElementById('hookCanvas');
        if (!canvas) return;
        const link = document.createElement('a');
        link.download = 'HookCard_' + Date.now() + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
    }
  }).mount('#app');
</script>

</body>
</html>
